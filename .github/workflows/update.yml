name: Update README

on:
  schedule:
    - cron: "5 4,12,19 * * *" # 4x/day, UTC
    - cron: "5 0 * * *"
  push:
    paths:
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/world-map.svg
          git diff --cached --quiet || (git commit -m "Update greeting and map" && git push)
